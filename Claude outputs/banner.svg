<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <style>
      .name{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;animation:fade 1s ease-out both}
      .role{font:400 26px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9fd3e6;animation:fade 1s ease-out .4s both}
      .line{font:500 22px 'Fira Code',Consolas,monospace;fill:#2c9ab7;opacity:0}
      .l1{animation:cycle 12s infinite 1s}
      .l2{animation:cycle 12s infinite 4s}
      .l3{animation:cycle 12s infinite 7s}
      .l4{animation:cycle 12s infinite 10s}
      .wave{animation:drift 8s ease-in-out infinite alternate}
      @keyframes fade{from{opacity:0}to{opacity:1}}
      @keyframes cycle{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-60px)}}
    </style>
  </defs>
  <rect width="1200" height="260" fill="url(#g)"/>
  <g class="wave" opacity="0.18" fill="#ffffff">
    <path d="M0 200 Q150 160 300 200 T600 200 T900 200 T1200 200 T1500 200 V260 H0 Z"/>
  </g>
  <g class="wave" opacity="0.10" fill="#9fd3e6" style="animation-duration:11s">
    <path d="M0 220 Q150 250 300 220 T600 220 T900 220 T1200 220 T1500 220 V260 H0 Z"/>
  </g>
  <text x="600" y="105" text-anchor="middle" class="name">Asier Martin</text>
  <text x="600" y="145" text-anchor="middle" class="role">AI &amp; Big Data Developer</text>
  <text x="600" y="190" text-anchor="middle" class="line l1">&gt; Building AI solutions and automations</text>
  <text x="600" y="190" text-anchor="middle" class="line l2">&gt; Machine Learning · LLMs · Big Data</text>
  <text x="600" y="190" text-anchor="middle" class="line l3">&gt; From PLCs to AI</text>
  <text x="600" y="190" text-anchor="middle" class="line l4">&gt; Python · Spark · AWS · Docker</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
